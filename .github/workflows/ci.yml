# CI — runs on every push and pull request to main.
# Node 26 LTS, matching the verified dev stack. No secrets needed:
# the site builds static; nothing is deployed from here.
# Note: no `astro check` step — @astrojs/check conflicts with
# TypeScript 7 in this project (peer ^5||^6), same as Creatix.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright)
        run: npm run test:e2e
